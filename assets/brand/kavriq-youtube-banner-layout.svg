  <!-- Soft brand glow behind the exact Kavriq mark. -->
  <path
    d="M 918 601 C 906 635 836 697 836 763 C 836 814 872 848 918 848 C 964 848 1000 814 1000 763 C 1000 697 930 635 918 601 Z"
    fill="#08a9c4" opacity="0.32" filter="url(#dropGlow)"/>
  <path
    d="M 918 601 C 906 635 836 697 836 763 C 836 814 872 848 918 848 C 964 848 1000 814 1000 763 C 1000 697 930 635 918 601 Z"
