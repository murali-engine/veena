<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <title>Kavriq YouTube banner foreground</title>
  <desc>The Kavriq drop mark, channel name, and tagline positioned within YouTube's centered safe area.</desc>
